[project]
name = "venture-research"
version = "0.1.0"
description = "BORE — Business Opportunity Research Engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai-agents>=0.24.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "rq>=3.0.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "tldextract>=5.4.0",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
bore = "bore.cli:app"

[build-system]
requires = ["uv_build>=0.10.0,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bore"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "playwright>=1.65.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-playwright>=0.10.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "requires_services: tests que necesitan PostgreSQL/Redis reales (BORE_TEST_DATABASE_URL / BORE_TEST_REDIS_URL)",
    "integration_external: pruebas con APIs externas de pago; desactivadas por defecto",
    "e2e: pruebas end-to-end con navegador; desactivadas por defecto",
]
addopts = '-m "not integration_external and not e2e"'

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/bore/domain/evidence.py" = ["RUF001", "RUF002"]
"src/bore/cli.py" = []

[tool.mypy]
mypy_path = "src"
packages = ["bore"]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rq", "redis", "tldextract", "alembic.*"]
ignore_missing_imports = true
