<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Venture Research{% endblock %}</title>
<script src="/static/htmx.min.js" defer></script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="brand-mark">VR</span>
      <span class="brand-text">
        <strong>Venture Research</strong>
        <small>Investigación de oportunidades de negocio</small>
      </span>
    </a>
    <nav class="site-nav">
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Investigaciones</a>
      <a href="/docs">API</a>
    </nav>
  </div>
</header>
{% block demo_banner %}{% endblock %}
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="wrap">La nota prioriza qué investigar; no demuestra rentabilidad.</div>
</footer>
</body>
</html>
